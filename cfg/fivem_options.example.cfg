# Catalogo de opcoes documentadas do FXServer (FiveM).
#
# Este arquivo e somente uma referencia: ele NAO e carregado pelo server.cfg.
# Todas as linhas de configuracao abaixo estao comentadas e nao alteram o servidor.
# Para usar uma opcao, copie somente a linha escolhida para o cfg apropriado,
# confira os avisos e evite duplicar valores que ja existam em outros arquivos.
#
# A lista cobre as opcoes gerais do servidor documentadas pelo Cfx.re; resources
# podem adicionar suas proprias convars. Nomes, valores e disponibilidade podem
# variar conforme a versao do artifact.
# Referencia: https://docs.fivem.net/docs/server-manual/server-commands/

# ============================================================
# JOGO, IDENTIDADE E CAPACIDADE
# ============================================================

# Jogo atendido pelo artifact. FiveM usa gta5; RedM usa rdr3.
# gamename gta5

# Nome publico, tipo e descricao exibidos no navegador.
# Os valores de hostname, projeto e descricao ja ficam em cfg/base.cfg.
# sv_hostname "Nome do servidor"
# sets sv_projectName "Nome do projeto"
# sets sv_projectDesc "Descricao do servidor"
# gametype "Roleplay"
# mapname "Los Santos"

# Numero maximo de jogadores. Ja configurado em cfg/base.cfg.
# sv_maxClients 10

# Build minimo do GTA exigido. Ja configurado em cfg/base.cfg.
# sv_enforceGameBuild 3751

# Chave de licenca Cfx.re. Ja configurada em cfg/base.cfg.
# Mantenha a chave real somente no arquivo local e nunca publique-a.
# sv_licenseKey "SUA_CHAVE_CFX"

# Opcoes de compatibilidade para troca de build via executavel; avancado.
# set sv_replaceExeToSwitchBuilds true

# ============================================================
# LISTAGEM, ACESSO E PRIVACIDADE
# ============================================================

# Redige enderecos IP dos jogadores em saidas publicas do servidor.
# sv_endpointPrivacy true

# Servidor somente LAN: nao aparece na lista publica e pula a verificacao da license key.
# Nao e o perfil publico do mz_starter.
# sv_lan true

# Faz o servidor aparecer como allowlisted (icone de cadeado) no navegador.
# Requer que o controle de acesso/allowlist esteja configurado no proprio servidor.
# sets sv_appearAllowlisted true
# sets sv_allowlistInstructions "Como solicitar acesso: https://exemplo.com"

# Desabilita o botao de conexao pelo navegador, mas nao remove o servidor da lista.
# Nao use para tentar esconder/deslistar o servidor.
# sv_master1 ""

# Forca listagem indireta para nao anunciar o IP real; requer proxy/override.
# sv_forceIndirectListing true
# sv_listingIpOverride "IP_PUBLICO_DO_PROXY"
# sv_listingHostOverride "play.exemplo.com"

# IPs que clientes podem usar para conectar; separados por espacos.
# Deixe sem configurar para deteccao automatica, salvo necessidade de NAT/proxy.
# sv_endpoints "203.0.113.10"

# Redes CIDR consideradas proxies. Ajuste apenas para a topologia real.
# sv_proxyIPRanges "10.0.0.0/8 127.0.0.0/8 192.168.0.0/16 172.16.0.0/12"

# Registra o servidor via DNS multicast; voltado a descoberta na rede local.
# sv_registerMulticastDns true

# ============================================================
# ONESYNC E SINCRONIZACAO DE ENTIDADES
# ============================================================

# O modo OneSync ja esta ativo em cfg/onesync.cfg; nao duplique esta linha.
# set onesync on

# Modos: off, on ou legacy. Legacy e apenas para compatibilidade antiga;
# off desativa OneSync e nao e compativel com o perfil atual do mz_starter.
# set onesync legacy
# set onesync off

# Sistema Infinity para sincronizacao em larga escala; normalmente ja habilitado.
# set onesync_enableInfinity true

# Permite spawn/gerenciamento da populacao (pedestres e veiculos ambient).
# Desativar afeta NPCs; valide os scripts antes de mudar.
# set onesync_population true

# Migra entidades quando o dono atual fica irrelevante ou desconecta.
# Desativar pode deixar entidades sem dono.
# set onesync_forceMigration true

# Remove entidades fora da distancia/campo de visao para reduzir sincronizacao.
# set onesync_distanceCulling true

# Aplica distance culling tambem a veiculos; pode mudar a experiencia de jogo.
# set onesync_distanceCullVehicles false

# Frequencia de sincronizacao baseada em raio; ajuste somente apos medir o efeito.
# set onesync_radiusFrequency true

# Envio mais preciso de dados de rede; opcao avancada de compatibilidade.
# set sv_useAccurateSends true

# Bloqueio de criacao de entidades: inactive, relaxed ou strict.
# Pode impedir spawns feitos por resources; teste antes de habilitar.
# set sv_entityLockdown strict

# ============================================================
# PURE MODE E CONTROLES DE SEGURANCA
# ============================================================

# Pure mode protege contra arquivos modificados no cliente:
# 1 bloqueia arquivos modificados, exceto audio e mods graficos conhecidos.
# 2 bloqueia todos os arquivos modificados do cliente.
# Clientes com arquivos base do jogo alterados podem nao conseguir conectar.
# Comece pelo nivel 1 e valide os mods aceitos pela comunidade.
# sv_pureLevel 1
# sv_pureLevel 2

# Script Hook V nos clientes. Manter false; true nao e recomendado pela Cfx.re.
# sv_scriptHookAllowed false

# Bloqueia eventos de som de rede comumente abusados; pode afetar alguns resources.
# set sv_enableNetworkedSounds false

# Permite eventos de explosao de telefone pela rede. Mantido false por seguranca.
# Nao habilite sem necessidade comprovada.
# set sv_enableNetworkedPhoneExplosions false

# Bloqueia eventos de alteracao de estado de entidades via rede; valide compatibilidade.
# set sv_enableNetworkedScriptEntityStates false

# Bloqueia pedidos de controle de entidades. Valores: 0=off, 1..4 mais restritivos.
# Nivel 1 atua em veiculos ocupados estabilizados; 2 em entidades de jogadores;
# 3 tambem em entidades non-player estabilizadas; 4 nao roteia esses pedidos.
# Pode interromper interacoes legitimas; aplique e teste por etapas.
# set sv_filterRequestControl 1
# Tempo em milissegundos para uma entidade ser considerada estabilizada (padrao 30000).
# set sv_filterRequestControlSettleTimer 30000

# Protecao contra floods HTTP: 0=off, 1 bloqueia requisicoes com Via,
# 2 tambem bloqueia Upgrade-Insecure-Requests, 3 fecha o socket.
# Nivel 2 ou maior tambem bloqueia info.json, dynamic.json e players.json.
# set sv_requestParanoia 1

# Variabilidade e confiabilidade dos identificadores de autenticacao (1 a 5).
# Variance: padrao 5. Trust: padrao 1. Altere somente com politica de identidade definida.
# set sv_authMaxVariance 5
# set sv_authMinTrust 1

# Impede modificacao client-side de state bags replicadas; pode quebrar resources
# que escrevem nelas pelo cliente. Opcao introduzida em artifacts mais recentes.
# setr sv_stateBagStrictMode true

# ============================================================
# REDE, EVENTOS E PROXY DE ARQUIVOS
# ============================================================

# Fecha conexoes TCP ociosas apos o tempo indicado, em segundos (padrao 5).
# set sv_tcpConnectionTimeoutSeconds 5

# Reagrupa eventos de rede grandes divididos em varios pacotes (padrao true).
# set sv_enableNetEventReassembly true

# Maximo de eventos aguardando reagrupamento por cliente (0 a 254; padrao 100).
# set sv_netEventReassemblyMaxPendingEvents 100

# Permite quantidade ilimitada de eventos pendentes; sobrepoe o limite acima.
# Pode aumentar o uso de memoria; mantenha false salvo necessidade validada.
# set sv_netEventReassemblyUnlimitedPendingEvents false

# Restringe o file server a enderecos nas faixas proxy configuradas em sv_proxyIPRanges.
# Use true somente quando o trafego de arquivos realmente passar pelo proxy.
# set sv_httpFileServerProxyOnly true

# ============================================================
# OPCOES EXPERIMENTAIS
# ============================================================

# O artifact pode habilitar estas melhorias por padrao. Sao configuracoes
# experimentais/versao-dependentes; mantenha sem override salvo orientacao oficial.
# set sv_experimentalStateBagsHandler true
# set sv_experimentalOnesyncPopulation true
# set sv_experimentalNetGameEventHandler true

# ============================================================
# INTEGRACOES E CREDENCIAIS OPCIONAIS
# ============================================================

# Icone do servidor: PNG de 96x96. Ja existe uma configuracao em cfg/base.cfg.
# load_server_icon logo.png

# Sem senha, RCon fica desabilitado. Nao habilite sem firewall e senha forte.
# Nunca grave uma senha real em arquivo versionado.
# set rcon_password "COLOQUE_UMA_SENHA_FORTE_FORA_DO_REPOSITORIO"

# Steam Web API key: opcional, necessaria apenas para obter identificadores Steam.
# Nao grave a chave em arquivo versionado.
# set steam_webApiKey "SUA_CHAVE_STEAM"
# set steam_webApiDomain "api.steampowered.com"

# Autenticacao basica do endpoint /perf do Prometheus; mantenha vazio para desativar.
# Guarde credenciais reais fora do repositorio.
# set sv_prometheusBasicAuthUser "usuario"
# set sv_prometheusBasicAuthPassword "senha"

# Nome do banco KVP em serverdata:/ (padrao default); definido no inicio do servidor.
# set sv_kvsName "default"

# Segredo Tebex: opcao de integracao. Nao armazene o segredo em arquivo versionado.
# set sv_tebexSecret "SEGREDO_TEBEX_FORA_DO_REPOSITORIO"

# ============================================================
# AJUSTES AVANCADOS E DIAGNOSTICO DE CONSOLE
# ============================================================

# Aumenta pools internos de memoria. Use apenas diante de avisos de pool cheio;
# escolha o pool e o incremento com base no diagnostico do artifact/resources.
# increase_pool_size "TxdStore" 6000
# increase_pool_size "CMoveObject" 15

# Filtros de saida do console (regex e acao); podem esconder diagnosticos uteis.
# Acoes documentadas: noprint, drop, devonly.
# con_addChannelFilter "citizen-server-impl" noprint
# con_removeChannelFilter "citizen-server-impl" noprint
# Lista os filtros ativos; comando de consulta, sem efeito persistente.
# con_channelFilters
