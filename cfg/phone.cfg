# ============================================================
# MZ PHONE
# Configuracao da instalacao/cidade
# ============================================================
#
# Gameplay e comportamento:
#   mz_phone/shared/config.lua
#
# Infraestrutura, storage e upload do Node:
#   mz_phone_server/.env
#
# Este arquivo e a fonte canonica para URLs e segredos usados
# pelo FXServer. Nao coloque esses valores em Lua ou JavaScript.
# ============================================================

# URL PUBLICA acessivel pela NUI e pelos jogadores.
# Sem barra no final. Deve ser HTTPS em producao.
set mz_phone_public_base_url "https://phone.seudominio.com"

# URL INTERNA usada somente pelo FXServer para falar com o companion.
# O padrao abaixo e correto quando ambos rodam na mesma VPS.
set mz_phone_media_companion_url "http://127.0.0.1:3025"

# Segredo compartilhado entre FXServer e mz_phone_server.
# Gere um valor aleatorio com pelo menos 32 caracteres e copie o
# MESMO valor para MZ_PHONE_ISSUER_SECRET no .env do companion.
set mz_phone_media_issuer_secret "ALTERE_PARA_UM_SEGREDO_FORTE_COM_32_CARACTERES"

# Opcional. Sem esta convar, o mz_phone gera e persiste o pepper em
# mz_phone/.mz_phone_pin_pepper. Preserve esse arquivo nos backups,
# pois troca-lo invalida a verificacao dos PINs ja cadastrados.
# set mz_phone_pin_pepper "ALTERE_PARA_OUTRO_SEGREDO_FORTE"
